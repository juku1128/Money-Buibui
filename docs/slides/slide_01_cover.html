<!DOCTYPE html><html><head><meta charset="UTF-8"><style>
        
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  width: 1920px;
  height: 1080px;
  overflow: hidden;
  font-family: -apple-system, BlinkMacSystemFont, "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", sans-serif;
  background-color: #FFFDF9;
  background-image: 
    radial-gradient(#E8D8C8 1.2px, transparent 1.2px),
    linear-gradient(to bottom, #FFFDF9 0%, #FAF5EE 100%);
  background-size: 24px 24px, 100% 100%;
  color: #3D312A;
  padding: 50px 70px;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  position: relative;
}
.slide-top-bar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  border-bottom: 2px solid #EFE6D8;
  padding-bottom: 16px;
}
.brand-badge {
  display: inline-flex;
  align-items: center;
  gap: 10px;
  font-size: 18px;
  font-weight: 800;
  color: #E76F51;
  background: #FFE8E0;
  padding: 6px 18px;
  border-radius: 9999px;
  border: 1.5px solid #F8B5A5;
}
.beginner-badge {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  font-size: 16px;
  font-weight: 700;
  color: #2E7D32;
  background: #E8F5E9;
  padding: 6px 16px;
  border-radius: 12px;
  border: 1px solid #C8E6C9;
}
.slide-counter {
  font-size: 18px;
  font-weight: 700;
  color: #A89F91;
  font-family: ui-monospace, monospace;
}
.washi-tape {
  position: absolute;
  height: 28px;
  opacity: 0.9;
  transform: rotate(-2deg);
  border-radius: 4px;
  box-shadow: 0 2px 6px rgba(0,0,0,0.06);
}
.tape-matcha { background-color: #A8C3A0; width: 130px; top: -14px; left: 30px; }
.tape-sakura { background-color: #F8CAD4; width: 130px; top: -14px; right: 30px; }
.tape-coral { background-color: #F4A261; width: 130px; top: -14px; left: 30px; }
.card {
  background: #FFFFFF;
  border: 2px solid #EFE6D8;
  border-radius: 24px;
  padding: 30px;
  box-shadow: 0 8px 25px rgba(74, 52, 37, 0.05);
  position: relative;
}
.slide-footer {
  border-top: 2px solid #EFE6D8;
  padding-top: 16px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  font-size: 17px;
  color: #A89F91;
  font-weight: 600;
}
.tag-pill {
  display: inline-block;
  padding: 4px 12px;
  border-radius: 8px;
  font-size: 14px;
  font-weight: 700;
}

        .cover-box {
