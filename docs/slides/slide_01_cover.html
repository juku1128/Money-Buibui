<!DOCTYPE html><html><head><meta charset="UTF-8"><style>
        
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  width: 1920px;
  height: 1080px;
  overflow: hidden;
  font-family: -apple-system, BlinkMacSystemFont, "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", sans-serif;
  background-color: #FFFDF9;
  background-image: 
    radial-gradient(#E8D8C8 1px, transparent 1px),
    linear-gradient(to bottom, #FFFDF9 0%, #FAF5EE 100%);
  background-size: 24px 24px, 100% 100%;
  color: #3D312A;
  padding: 60px 80px;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  position: relative;
}
.slide-top-bar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  border-bottom: 2px solid #EFE6D8;
  padding-bottom: 20px;
}
.brand-badge {
  display: inline-flex;
  align-items: center;
  gap: 10px;
  font-size: 20px;
  font-weight: 800;
  color: #E76F51;
  background: #FFE8E0;
  padding: 6px 20px;
  border-radius: 9999px;
  border: 1.5px solid #F8B5A5;
}
.slide-counter {
  font-size: 18px;
  font-weight: 700;
  color: #A89F91;
  font-family: ui-monospace, monospace;
}
.washi-tape {
  position: absolute;
  height: 32px;
  opacity: 0.88;
  transform: rotate(-2deg);
  border-radius: 4px;
  box-shadow: 0 2px 8px rgba(0,0,0,0.06);
}
.tape-matcha { background-color: #A8C3A0; width: 140px; top: -16px; left: 40px; }
.tape-sakura { background-color: #F8CAD4; width: 140px; top: -16px; right: 40px; }
.tape-coral { background-color: #F4A261; width: 140px; top: -16px; left: 40px; }
.card {
  background: #FFFFFF;
  border: 2px solid #EFE6D8;
  border-radius: 28px;
  padding: 36px;
  box-shadow: 0 8px 30px rgba(74, 52, 37, 0.05);
  position: relative;
}
.slide-footer {
  border-top: 2px solid #EFE6D8;
  padding-top: 20px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  font-size: 18px;
  color: #A89F91;
  font-weight: 600;
}

        .cover-container {
          flex: 1;
          display: flex;
          align-items: center;
          justify-content: space-between;
          padding: 40px 20px;
          gap: 60px;
        }
        .hero-left {
          flex: 1.2;
          display: flex;
          flex-direction: column;
          gap: 24px;
        }
        .main-title {
          font-size: 68px;
          font-weight: 900;
          line-height: 1.15;
          color: #2E2018;
          letter-spacing: -1px;
        }
        .main-title span {
          color: #E76F51;
        }
        .sub-title {
          font-size: 28px;
          font-weight: 600;
          color: #7D6E66;
          line-height: 1.4;
        }
        .pitch-box {
          background: #FFF5F2;
          border-left: 6px solid #E76F51;
          padding: 20px 28px;
          border-radius: 0 20px 20px 0;
          font-size: 22px;
          font-weight: 700;
          color: #A03D26;
        }
        .hero-meta {
          display: flex;
          gap: 16px;
          margin-top: 10px;
        }
        .meta-chip {
          background: #FAF6EF;
          border: 1.5px solid #E5DACD;
          padding: 10px 22px;
          border-radius: 16px;
          font-size: 18px;
          font-weight: 700;
          color: #5C4B40;
          display: flex;
          align-items: center;
          gap: 8px;
        }
        .hero-right {
          flex: 0.9;
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          position: relative;
        }
        .shiba-circle {
          width: 440px;
          height: 440px;
          background: radial-gradient(circle, #FFEAD9 0%, #FFF8F0 70%);
          border-radius: 50%;
          display: flex;
          align-items: center;
          justify-content: center;
          border: 4px dashed #F4A261;
          padding: 30px;
          box-shadow: 0 20px 50px rgba(244, 162, 97, 0.25);
        }
        .floating-badge {
          position: absolute;
          background: #FFFFFF;
          border: 2px solid #E76F51;
          padding: 12px 24px;
          border-radius: 20px;
          font-size: 18px;
          font-weight: 800;
          color: #E76F51;
          box-shadow: 0 8px 24px rgba(231, 111, 81, 0.2);
        }
        .fb-1 { top: 20px; right: 20px; }
        .fb-2 { bottom: 30px; left: 10px; }
