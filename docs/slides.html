<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <title>Money Buddy — 16:9 橫向簡報放映 (程式新手版)</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #141414;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: sans-serif;
      color: white;
    }
    .slides-container {
      width: 100vw;
      height: 100vh;
      max-width: 177.78vh; /* 16:9 */
      max-height: 56.25vw;
      position: relative;
      box-shadow: 0 10px 40px rgba(0,0,0,0.8);
      background: #000;
    }
    .slide-wrap {
      display: none;
      width: 100%;
      height: 100%;
    }
    .slide-wrap.active {
      display: block;
      animation: fadeIn 0.25s ease;
    }
    .slide-wrap img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.995); }
      to { opacity: 1; transform: scale(1); }
    }
    .controls {
      position: fixed;
      bottom: 20px;
      display: flex;
      align-items: center;
      gap: 16px;
      background: rgba(0,0,0,0.75);
      padding: 8px 24px;
      border-radius: 9999px;
      backdrop-blur: 8px;
      border: 1px solid rgba(255,255,255,0.2);
      z-index: 99;
    }
    .btn {
      background: rgba(255,255,255,0.15);
      border: none;
      color: white;
      padding: 6px 14px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
      font-size: 14px;
      transition: background 0.2s;
    }
    .btn:hover {
      background: #E76F51;
    }
    .page-info {
      font-size: 14px;
      font-weight: bold;
      font-family: monospace;
    }
    .hint {
      position: fixed;
      top: 14px;
      right: 20px;
      font-size: 12px;
      color: rgba(255,255,255,0.5);
    }
  </style>
</head>
<body>
  <div class="hint">按鍵盤 ⬅️ / ➡️ 或點擊按鈕切換 │ 按 F11 全螢幕放映</div>
  <div class="slides-container">
    <div class="slide-wrap active"><img src="slides/slide_01_cover.png" alt="封面"></div>
<div class="slide-wrap "><img src="slides/slide_02_what_who.png" alt="做什麼、給誰用"></div>
<div class="slide-wrap "><img src="slides/slide_03_process.png" alt="開發過程（簡易摘要）"></div>
<div class="slide-wrap "><img src="slides/slide_04_features_overview.png" alt="功能介紹總覽"></div>
<div class="slide-wrap "><img src="slides/slide_05_demo_dash.png" alt="實測 1：首頁與本機紀錄"></div>
<div class="slide-wrap "><img src="slides/slide_06_demo_planning.png" alt="實測 2：理財規劃試算"></div>
<div class="slide-wrap "><img src="slides/slide_07_demo_transactions.png" alt="實測 3：三層級記帳視圖"></div>
<div class="slide-wrap "><img src="slides/slide_08_demo_debts.png" alt="實測 4：借貸與催款話術"></div>
<div class="slide-wrap "><img src="slides/slide_09_demo_hell.png" alt="實測 5：極限地獄催款模式"></div>
<div class="slide-wrap "><img src="slides/slide_10_testing_next_summary.png" alt="怎麼測與下一步"></div>
  </div>

  <div class="controls">
    <button class="btn" onclick="prevSlide()">◀ 上一張</button>
    <span class="page-info" id="page-num">1 / 10</span>
    <button class="btn" onclick="nextSlide()">下一張 ▶</button>
    <a href="../" class="btn" style="text-decoration:none; background:#E76F51;">🚀 切換到現場 Demo</a>
  </div>

  <script>
    let current = 0;
    const slides = document.querySelectorAll('.slide-wrap');
    const pageNum = document.getElementById('page-num');

    function showSlide(index) {
      slides.forEach(s => s.classList.remove('active'));
      current = (index + slides.length) % slides.length;
      slides[current].classList.add('active');
      pageNum.innerText = (current + 1) + ' / ' + slides.length;
    }

    function prevSlide() { showSlide(current - 1); }
    function nextSlide() { showSlide(current + 1); }

    window.addEventListener('keydown', e => {
      if (e.key === 'ArrowRight' || e.key === 'Space') nextSlide();
      if (e.key === 'ArrowLeft') prevSlide();
    });
  </script>
</body>
</html>
